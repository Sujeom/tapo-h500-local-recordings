# The gate that already exists, run by something other than memory.
#
# tools/verify.sh is a real gate -- 1200 tests, the card suite, an AST parse of
# every module, a YAML/JSON sweep and a translation-key check -- and nothing
# automated ran it. This repo is what HACS installs from, so a push that
# skipped it shipped.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push to the same branch makes the first run's answer worthless.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and history, not just the tip. Two tests read them -- the
          # release tool's tag parsing, and that the manifest version is at or
          # ahead of the last release commit -- and a shallow checkout has
          # neither, so both were skipping or failing in CI while passing
          # everywhere else.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # The floor hacs.json declares Home Assistant needs, and the version
          # the suite is developed on. A syntax error that only 3.13 rejects is
          # still a syntax error for somebody.
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install what the suite reads
        # Not the integration's own requirement (pytapo): the suite stubs it,
        # deliberately, so a hub library release cannot turn the tests red.
        #
        # requests IS installed, though it is guarded and the suite passes
        # without it. The auth-classifier test asserts that requests'
        # exceptions really are OSError subclasses -- the premise the whole
        # classifier rests on -- and skipping that in CI would leave the one
        # place it gets checked automatically checking nothing.
        run: python -m pip install --upgrade pyyaml jinja2 requests

      - name: ffmpeg
        # The contact-sheet tests skip themselves without it, and a skipped
        # test that nobody notices is the same as no test.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: tools/verify.sh
        run: bash tools/verify.sh

      - name: Coverage
        # Gated on ratchets, not targets: the total floor sits just under
        # where the suite actually is, so improvement is kept rather than
        # demanded, and the per-module floor makes a NEW untested module fail
        # the build -- nine shipped at 0.0% and nothing said so until
        # somebody went looking.
        run: python -B tools/coverage.py --gate

      - name: Card coverage
        # The same measurement for the dashboard card, which had none. Node
        # emits V8 coverage on its own, so this needs nothing installed
        # either -- and "all card tests passed" only ever said that the ones
        # written pass.
        run: python -B tools/card_coverage.py --gate

  # Home Assistant's own manifest validator, and HACS's. Both need the network
  # and a checkout, so they cannot run in tools/verify.sh -- tests/test_manifest.py
  # applies the same rules locally so a mistake fails on the commit that made it.
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # Two of the nine checks are about the GitHub repository rather than
          # anything in it: it has no description and no topics. Neither can be
          # set from a commit, so they failed every run and buried the seven
          # that do check the code.
          #
          # The cost of skipping them is real but small: HACS shows a
          # repository's description when somebody is deciding whether to
          # download it, and this one will show blank. Set both under Settings
          # -> General, or the gear beside "About" on the repository page, and
          # then delete this line -- the other seven have never needed it.
          ignore: description topics

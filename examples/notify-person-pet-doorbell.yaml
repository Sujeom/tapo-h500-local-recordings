# Notify on a person, an animal, or the doorbell — one automation, both cameras.
#
# The notification says what happened and where: "Person at Side Doorbell" /
# "Saw a person and a dog, 5:41 PM". Codes come from the hub's own detection
# log: 6 person, 9 pet, 17 doorbell. Plain motion (2) is deliberately not a
# reason to notify — it fires on nearly everything — but it is still described
# if it came along with something that is.
#
# Paste into Settings > Automations > three-dot menu > Edit in YAML, or drop
# the automation: block into configuration.yaml.

alias: Doorbell, person or animal
description: Notifies for the events worth interrupting someone for.
mode: parallel        # two cameras can fire at the same moment
max: 10

triggers:
  # Trigger on the entity, not on an attribute: an event entity's state is the
  # timestamp of its last event and changes every time, whereas the attribute
  # does not change between two events of the same kind and the second would be
  # missed. Add a line per camera.
  - trigger: state
    entity_id:
      - event.front_doorbell_activity
      - event.side_doorbell_activity

conditions:
  # Skip the entity restoring its last event on a restart or reload.
  - condition: template
    value_template: >-
      {{ trigger.from_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state not in ['unknown', 'unavailable'] }}
  # Only person, pet or doorbell. detection_types lists everything that fired
  # at once, so a person who also triggers plain motion still matches.
  - condition: template
    value_template: >-
      {{ (state_attr(trigger.entity_id, 'detection_types') or [])
         | select('in', [6, 9, 17]) | list | count > 0 }}

actions:
  - variables:
      codes: "{{ state_attr(trigger.entity_id, 'detection_types') or [] }}"
      # event.front_doorbell_activity -> camera.front_doorbell
      camera: >-
        {{ trigger.entity_id | replace('event.', 'camera.')
           | replace('_activity', '') }}
      # "Front Doorbell Activity" -> "Front Doorbell"
      where: "{{ trigger.to_state.name | replace(' Activity', '') }}"
      # event.front_doorbell_activity -> sensor.front_doorbell_last_activity
      activity: >-
        {{ trigger.entity_id | replace('event.', 'sensor.')
           | replace('_activity', '_last_activity') }}
      # This event's own timestamp, to compare against that sensor.
      moment: "{{ trigger.to_state.state | as_timestamp | int }}"
      # A URL to this event's own thumbnail, fixed at the moment it fired.
      frame: "{{ state_attr(trigger.entity_id, 'image') }}"
      when: >-
        {{ (trigger.to_state.state | as_datetime | as_local)
           .strftime('%-I:%M %p') }}
      # Everything the hub saw, most significant first, in words. Motion is
      # last because it is the least informative.
      #
      # Code 10 -- an unanswered press -- is deliberately NOT listed. It rides
      # along with every 17, so "a doorbell press and a missed doorbell" would
      # read as two contradictory events. The headline already says someone
      # rang; whether it went unanswered is not news one second later.
      seen: >-
        {%- set words = {19: 'tampering', 17: 'a doorbell press',
                         6: 'a person', 20: 'a familiar face',
                         22: 'an unfamiliar face', 9: 'an animal',
                         8: 'a vehicle', 2: 'motion'} -%}
        {%- set ns = namespace(parts=[]) -%}
        {%- for c in [19, 17, 6, 20, 22, 9, 8, 2] if c in codes -%}
          {%- set ns.parts = ns.parts + [words[c]] -%}
        {%- endfor -%}
        {%- if ns.parts | count > 1 -%}
          {{ ns.parts[:-1] | join(', ') }} and {{ ns.parts[-1] }}
        {%- else -%}
          {{ ns.parts | join }}
        {%- endif -%}

  # Sent twice on purpose, and the second replaces the first.
  #
  # At this moment no picture of THIS event exists anywhere. The hub only
  # indexes a recording once it has finished, the integration downloads it
  # after that, and the camera entity serves the newest thumbnail on disk --
  # which is still the PREVIOUS event. Attaching it here is how the wrong
  # photo ends up on the phone. So the first notification carries no image
  # and arrives immediately; the second carries the real frame and, sharing
  # the same tag, takes its place rather than adding a second alert.
  - action: notify.mobile_app_phone      # <- your notify service
    data:
      # Headline: the single most important thing, and which camera. Most
      # events carry several codes at once -- a doorbell press is also a
      # person, a person is usually also motion -- so the headline picks by
      # priority: doorbell, then person, then animal. First match wins.
      #
      # Tampering deliberately does NOT take the headline; it is the first
      # thing listed in the body instead. Swap the two lines if you would
      # rather have "Camera tampering" shout over "Person".
      title: >-
        {% if 17 in codes %}Someone rang the {{ where }}
        {% elif 6 in codes %}Person at {{ where }}
        {% else %}Animal at {{ where }}{% endif %}
      # Body: everything else that fired, and when.
      message: "Saw {{ seen }}, {{ when }}"
      data:
        tag: tapo-h500-{{ camera }}      # a new alert replaces the old one

        # Tapping the notification body opens that camera's own dialog, with
        # the live image and its history -- not a generic dashboard. Android
        # reads clickAction, iOS reads url, so both are set to the same place.
        # "0" is the first dashboard; change it if yours lives elsewhere.
        clickAction: /lovelace/0?more-info-entity-id={{ camera }}
        url: /lovelace/0?more-info-entity-id={{ camera }}

        # Two buttons under the notification.
        #
        # The clip is NOT linkable at this moment: the hub only indexes a
        # recording once it has finished, and the integration then downloads
        # it, so a direct video URL would be dead on arrival. Recordings opens
        # the media browser, where the clip appears once it lands -- usually
        # within a minute. The Tapo H500 cards are the other way in.
        actions:
          - action: URI
            title: Camera
            uri: /lovelace/0?more-info-entity-id={{ camera }}
          - action: URI
            title: Recordings
            uri: /media-browser/local/tapo_h500

  # Wait for this event's own clip to be indexed. last_activity holds the start
  # time of the newest recording, so it passing the event's own timestamp is
  # what says "the clip for this is in". Give up rather than send a stale photo.
  - wait_template: >-
      {{ as_timestamp(states(activity), 0) | int >= moment }}
    timeout: "00:03:00"
    continue_on_timeout: false
  # Indexed is not yet downloaded, and the thumbnail is written by the
  # download. A short pause covers the gap; the wait above did the real work.
  - delay: "00:00:08"
  - action: notify.mobile_app_phone      # <- same service as above
    data:
      title: >-
        {% if 17 in codes %}Someone rang the {{ where }}
        {% elif 6 in codes %}Person at {{ where }}
        {% else %}Animal at {{ where }}{% endif %}
      message: "Saw {{ seen }}, {{ when }}"
      data:
        # This event's own frame, not "whatever is newest". The camera entity
        # answers with the latest thumbnail on disk, so if another event lands
        # while this notification is sitting on your phone, the picture changes
        # under it. The event carries a URL pinned to its own timestamp.
        image: "{{ frame }}"
        tag: tapo-h500-{{ camera }}      # same tag: replaces, never duplicates
        clickAction: /lovelace/0?more-info-entity-id={{ camera }}
        url: /lovelace/0?more-info-entity-id={{ camera }}
        actions:
          - action: URI
            title: Camera
            uri: /lovelace/0?more-info-entity-id={{ camera }}
          - action: URI
            title: Recordings
            uri: /media-browser/local/tapo_h500

# Try to un-wedge a silent camera without a power cycle.
#
# The TD21 fails in a way nothing reports: it keeps its radio link and still
# serves live view while producing no clips and no detections. There is no
# camera-reboot command to send -- the hub has no addressable camera child,
# getChildDeviceList answers sum: 0 -- so these two switches are the entire
# reachable write surface between "notice" and "go outside".
#
# ponytail: neither toggle is proven to cure the wedge; they are untested
# guesses that cost a settings write. Delete this file if a proven cure turns
# up. The hub restart is deliberately NOT here -- these cameras recorded
# straight through five nightly hub reboots and stayed dark, so trying it only
# delays the alert.
#
# Notification is watch_health.yaml's job -- it already triggers on the same
# sensors with the same 30-minute grace. Run both; this one tries, that one tells.

alias: Recover a silent Tapo camera
description: Toggle the hub's recording and detection switches when a camera goes silent.
mode: single

triggers:
  - trigger: state
    entity_id:
      - binary_sensor.side_doorbell_silent
      - binary_sensor.front_doorbell_silent
    to: "on"
    for: "00:30:00"

actions:
  - variables:
      # A recovered camera indexes a clip within minutes, so its own activity
      # sensor moving is the only proof either toggle did anything.
      activity: >-
        {{ trigger.entity_id | replace('binary_sensor.', 'sensor.')
           | replace('_silent', '_last_activity') }}
      started: "{{ as_timestamp(states(activity), 0) | int }}"

  # The write side.
  - action: switch.turn_off
    target: {entity_id: switch.h500_loop_recording}
  - delay: "00:00:05"
  - action: switch.turn_on
    target: {entity_id: switch.h500_loop_recording}
  - wait_template: "{{ as_timestamp(states(activity), 0) | int > started }}"
    timeout: "00:10:00"
  - if: [{condition: template, value_template: "{{ wait.completed }}"}]
    then: [{stop: "recovered after the loop-recording toggle"}]

  # The trigger side.
  - action: switch.turn_off
    target: {entity_id: switch.h500_face_detection}
  - delay: "00:00:05"
  - action: switch.turn_on
    target: {entity_id: switch.h500_face_detection}

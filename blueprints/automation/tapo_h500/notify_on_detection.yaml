blueprint:
  name: Tapo H500 detection notification
  description: >-
    Notify when a Tapo H500 doorbell sees something worth interrupting you for.

    The notification says what happened and where — "Someone rang the Front
    Doorbell", "Saw a person and an animal, 5:41 PM" — and arrives within about
    a second. It then replaces itself with one carrying that event's own
    photograph, because at the moment the hub reports a detection it is still
    recording and no picture of it exists anywhere yet.

    Plain motion is not offered as a trigger. It fires on nearly everything the
    camera sees and is only useful as a description of something else.
  domain: automation
  source_url: https://github.com/Sujeom/tapo-h500-local-recordings/blob/main/blueprints/automation/tapo_h500/notify_on_detection.yaml
  author: tapo-h500-local-recordings
  homeassistant:
    min_version: "2024.10.0"

  input:
    cameras:
      name: Cameras
      description: Which doorbells to watch. Their activity entities.
      selector:
        entity:
          filter:
            - domain: event
              integration: tapo_h500
          multiple: true

    notify_service:
      name: Notify service
      description: >-
        The full service to call, including the `notify.` prefix — for a phone
        this is usually `notify.mobile_app_` followed by the device name.
      default: notify.persistent_notification
      selector:
        text:

    detections:
      name: Notify for
      description: >-
        Which detections are worth a notification. The hub reports several at
        once, so a doorbell press that is also a person matches either.
      default: [17, 6, 9]
      selector:
        select:
          multiple: true
          options:
            - {label: Doorbell pressed, value: "17"}
            - {label: Person, value: "6"}
            - {label: Animal, value: "9"}
            - {label: Vehicle, value: "8"}
            - {label: Unfamiliar face, value: "22"}
            - {label: Recognised face, value: "20"}
            - {label: Camera tampering, value: "19"}
            - {label: Motion (noisy), value: "2"}

    quiet_entity:
      name: Only when
      description: >-
        Optional. A switch, person or input_boolean that must be in the state
        below for a notification to be sent — an away-mode toggle, say. Leave
        empty to always notify.
      default: ""
      selector:
        entity: {}

    quiet_state:
      name: ...is in this state
      description: The state the entity above must be in. Ignored if unset.
      default: "on"
      selector:
        text:

    snooze_entity:
      name: Snooze switch
      description: >-
        Optional. Stay silent while this is on. Pick the hub's own
        "Notifications snoozed" switch, which the `tapo_h500.snooze` action
        turns on for a set number of minutes — an afternoon of gardening or a
        party, without disabling this automation and forgetting to put it back.
      default: ""
      selector:
        entity:
          filter:
            - domain: switch
              integration: tapo_h500

    quiet_start:
      name: Quiet from
      description: >-
        Optional. No notifications between these two times — crossing
        midnight is fine — except notable ones (tampering at any hour, an
        unfamiliar face at night), which are loud precisely so quiet hours
        do not apply to them. Leave both empty to always notify.
      default: ""
      selector:
        time:

    quiet_end:
      name: Quiet until
      description: The end of the quiet window. Ignored unless both are set.
      default: ""
      selector:
        time:

    repeat_minutes:
      name: Repeat suppression
      description: >-
        Stay silent if this automation notified within the last few minutes —
        across every camera it watches, not per camera, since it is one
        automation. 0 sends every detection. Useful on a busy street, where one
        visitor produces several detections in a row.
      default: 0
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: minutes
          mode: box

    send_photo:
      name: Follow up with the photograph
      description: >-
        Send a second notification carrying the event's own frame once the hub
        has finished recording and the clip has downloaded. It replaces the
        first rather than adding to it.
      default: true
      selector:
        boolean:

    offer_naming:
      name: Offer to name unknown faces
      description: >-
        Add a "Name this face" button to notifications about someone the hub
        recognised but you have not named. Tapping it asks for a name on the
        phone, so a stranger becomes a name while you are looking at their
        photograph rather than in Settings later. Needs the companion app.
      default: true
      selector:
        boolean:

    dashboard_path:
      name: Dashboard path
      description: >-
        Where tapping the notification should go. `0` is your first dashboard.
      default: "0"
      selector:
        text:

mode: parallel
max: 25

triggers:
  - trigger: state
    entity_id: !input cameras
    id: detection
  # The phone answering the "Name this face" button. The same automation
  # handles it so the face id does not have to be carried anywhere else.
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: TAPO_H500_NAME_FACE
    id: naming
  # The phone answering the "Save clip" button on the photo notification.
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: TAPO_H500_SAVE_CLIP
    id: saving
  # The phone asking for an hour of quiet.
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: TAPO_H500_SNOOZE
    id: snoozing

conditions:
  # The naming reply is handled in its own branch below and skips every
  # detection condition, none of which apply to it.
  - condition: or
    conditions:
      - condition: trigger
        id: naming
      - condition: trigger
        id: saving
      - condition: trigger
        id: snoozing
      - condition: and
        conditions:

          # A real event, not the entity coming back to life. The entity is
          # `unknown` after every reload and restart, so requiring a valid
          # from_state dropped the FIRST press afterwards -- rang the bell,
          # no notification, fine the second time. What that half of the
          # guard was protecting against is a restored OLD event replaying
          # on startup, and the difference is the event's own age: a real
          # press is seconds old, a replay is hours old.
          - condition: template
            value_template: >-
              {{ trigger.to_state.state not in ['unknown', 'unavailable']
                 and (
                   (trigger.from_state is not none
                    and trigger.from_state.state not in ['unknown', 'unavailable'])
                   or now().timestamp()
                      - (trigger.to_state.state | as_timestamp(0)) < 300
                 ) }}
          # Only the detections chosen above. detection_types lists everything that
          # fired at once, so a person who also tripped motion still matches.
          - condition: template
            value_template: >-
              {% set wanted = input_detections | map('int') | list %}
              {% set seen = state_attr(trigger.entity_id, 'detection_types')
                            or [] %}
              {#- Unclassified passes. An empty list is the hub having indexed
                  the clip before its detection log caught up -- the event
                  carries real timing and a picture, and the classification
                  lands moments later. Dropping it loses the visitor outright,
                  which is not what a filter for "only these detections" was
                  ever meant to do. A populated list still has to match. -#}
              {{ not seen
                 or seen | select('in', wanted) | list | count > 0 }}
          # Optional gate: only notify while some other entity is in a given state.
          - condition: template
            value_template: >-
              {{ not input_quiet_entity
                 or states(input_quiet_entity) == input_quiet_state }}
          # Snoozed. A deliberate "not for the next hour", set from the phone
          # or a dashboard button, that does not stop anything being recorded.
          - condition: template
            value_template: >-
              {{ not input_snooze_entity
                 or states(input_snooze_entity) != 'on' }}
          # Quiet hours, wrap-around included. Notable events punch through:
          # the whole point of the loud channel is that silence does not
          # apply to it.
          - condition: template
            value_template: >-
              {%- set notable = notable
                  if notable is defined
                  else state_attr(trigger.entity_id, 'notable') or false -%}
              {%- if not input_quiet_start or not input_quiet_end -%}
                {{ true }}
              {%- elif notable -%}
                {{ true }}
              {%- else -%}
                {%- set clock = now().strftime('%H:%M') -%}
                {%- set start = input_quiet_start[0:5] -%}
                {%- set finish = input_quiet_end[0:5] -%}
                {%- if start <= finish -%}
                  {{ not (start <= clock < finish) }}
                {%- else -%}
                  {{ not (clock >= start or clock < finish) }}
                {%- endif -%}
              {%- endif -%}
          # Repeat suppression. last_triggered belongs to the automation, so this
          # covers every camera it watches rather than each one separately.
          - condition: template
            value_template: >-
              {% if input_repeat_minutes | int == 0 %}true
              {% else %}
                {{ (this.attributes.get('last_triggered') is none)
                   or (now() - this.attributes.last_triggered).total_seconds()
                      > (input_repeat_minutes | int) * 60 }}
              {% endif %}

variables:
  input_offer_naming: !input offer_naming
  input_detections: !input detections
  input_quiet_entity: !input quiet_entity
  input_quiet_state: !input quiet_state
  input_snooze_entity: !input snooze_entity
  input_repeat_minutes: !input repeat_minutes
  input_quiet_start: !input quiet_start
  input_quiet_end: !input quiet_end
  input_send_photo: !input send_photo
  service: !input notify_service
  dashboard: !input dashboard_path

actions:
  # The phone replying with a name. Store it and stop -- none of the
  # notification work below applies to a button press.
  - if:
      - condition: trigger
        id: naming
    then:
      - action: tapo_h500.name_face
        data:
          config_entry_id: "{{ trigger.event.data.entry }}"
          face_id: "{{ trigger.event.data.face_id }}"
          # reply_text is what was typed on the phone. Empty clears the name,
          # which is the same rule the card and the options screen use.
          name: "{{ trigger.event.data.reply_text | default('', true) }}"
      - stop: "named"

  # The phone asking for a clip to be kept. A manual download is never
  # pruned, so this is "keep that one forever" from the lock screen. No
  # end_time on purpose: the detection log never had one, and the service
  # looks it up in the hub's own clip index.
  - if:
      - condition: trigger
        id: saving
    then:
      - action: tapo_h500.download_recording
        data:
          config_entry_id: "{{ trigger.event.data.entry }}"
          camera_index: "{{ trigger.event.data.camera_index }}"
          start_time: "{{ trigger.event.data.start_time }}"
      - stop: "saved"

  # The phone asking for quiet. The service the snooze switch already
  # exposes: notifications pause for an hour, recording never stops, and
  # this automation stays enabled -- so there is nothing to remember to
  # turn back on.
  - if:
      - condition: trigger
        id: snoozing
    then:
      - action: tapo_h500.snooze
        data:
          config_entry_id: "{{ trigger.event.data.entry }}"
          minutes: 60
      - stop: "snoozed"

  - variables:
      codes: "{{ state_attr(trigger.entity_id, 'detection_types') or [] }}"
      # event.front_doorbell_activity -> camera.front_doorbell
      camera: >-
        {{ trigger.entity_id | replace('event.', 'camera.')
           | replace('_activity', '') }}
      # ...and -> sensor.front_doorbell_last_activity, which says when this
      # event's own clip has been indexed.
      activity: >-
        {{ trigger.entity_id | replace('event.', 'sensor.')
           | replace('_activity', '_last_activity') }}
      where: "{{ trigger.to_state.name | replace(' Activity', '') }}"
      moment: "{{ trigger.to_state.state | as_timestamp | int }}"
      # A URL pinned to this event's own timestamp, not "whatever is newest".
      frame: "{{ state_attr(trigger.entity_id, 'image') }}"
      when: >-
        {{ (trigger.to_state.state | as_datetime | as_local)
           .strftime('%-I:%M %p') }}
      # Everything the hub saw, most significant first. Code 10 is left out on
      # purpose: it accompanies every press, so "a doorbell press and a missed
      # doorbell" would read as two contradictory events.
      seen: >-
        {%- set words = {19: 'tampering', 17: 'a doorbell press',
                         6: 'a person', 20: 'a familiar face',
                         22: 'an unfamiliar face', 9: 'an animal',
                         8: 'a vehicle', 2: 'motion'} -%}
        {%- set ns = namespace(parts=[]) -%}
        {#- 6 and 20 are dropped once someone is named: "Alice - a person, a
            familiar face" says the same thing three times. -#}
        {%- set skip = [6, 20] if who else [] -%}
        {%- for c in [19, 17, 6, 20, 22, 9, 8, 2]
              if c in codes and c not in skip -%}
          {%- set ns.parts = ns.parts + [words[c]] -%}
        {%- endfor -%}
        {%- if ns.parts | count > 1 -%}
          {{ ns.parts[:-1] | join(', ') }} and {{ ns.parts[-1] }}
        {%- else -%}{{ ns.parts | join }}{%- endif -%}
      # Anyone recognised AND named, resolved by the integration: an
      # automation cannot read the hub's name map itself.
      who: >-
        {%- set names = state_attr(trigger.entity_id, 'faces') or [] -%}
        {%- if names | count > 1 -%}
          {{ names[:-1] | join(', ') }} and {{ names[-1] }}
        {%- else -%}{{ names | join }}{%- endif -%}
      headline: >-
        {% if 17 in codes and who %}{{ who }} rang the {{ where }}
        {% elif 17 in codes %}Someone rang the {{ where }}
        {% elif who %}{{ who }} at {{ where }}
        {% elif 6 in codes %}Person at {{ where }}
        {% elif 9 in codes %}Animal at {{ where }}
        {% elif 19 in codes %}Tampering at {{ where }}
        {% else %}Activity at {{ where }}{% endif %}
      link: "/lovelace/{{ dashboard }}?more-info-entity-id={{ camera }}"
      # An unfamiliar face during the configured night, decided by the
      # integration so this does not re-implement a window wrapping midnight.
      notable: "{{ state_attr(trigger.entity_id, 'notable') or false }}"
      # The hub gave this sighting a face id and no name of yours matched it.
      # That is the only case where naming from a notification makes sense.
      unnamed: >-
        {%- set ids = state_attr(trigger.entity_id, 'face_ids') or [] -%}
        {%- set known = state_attr(trigger.entity_id, 'faces') or [] -%}
        {{ ids[0] if ids and not known else '' }}
      # Built as a value rather than as YAML with {% if %} around list items:
      # the document is parsed before any template runs, so Jinja cannot add
      # or remove keys and entries -- it can only fill them in.
      buttons: >-
        {%- set base = [
              {'action': 'URI', 'title': 'Camera', 'uri': link},
              {'action': 'TAPO_H500_SNOOZE', 'title': 'Snooze 1h',
               'entry': config_entry_id(trigger.entity_id)}] -%}
        {%- if input_offer_naming and unnamed -%}
          {#- face_id and entry travel WITH the button: the companion app
              echoes unknown keys back in the event, which is the only way the
              reply knows which face it is answering about. Deriving it from a
              device id afterwards does not work -- the event carries no
              reliable device. -#}
          {{ base + [{'action': 'TAPO_H500_NAME_FACE',
                      'title': 'Name this face',
                      'behavior': 'textInput',
                      'textInputButtonTitle': 'Save',
                      'textInputPlaceholder': 'Who is this?',
                      'face_id': unnamed,
                      'entry': config_entry_id(trigger.entity_id)}] }}
        {%- else -%}{{ base }}{%- endif -%}
      # The photo notification's buttons: Save clip takes Snooze's slot.
      # Android shows at most three actions, so appending a fourth would
      # silently drop one -- and by the time the photograph arrives, anyone
      # who wanted quiet pressed Snooze on the first alert half a minute
      # ago. Save only exists here because at first-notification time the
      # hub is usually still recording and there is nothing indexed to
      # save. camera_index rides on the event entity for exactly this.
      photo_buttons: >-
        {%- set save = [{'action': 'TAPO_H500_SAVE_CLIP',
                         'title': 'Save clip',
                         'entry': config_entry_id(trigger.entity_id),
                         'camera_index': state_attr(trigger.entity_id,
                                                    'camera_index'),
                         'start_time': moment}] -%}
        {{ buttons | rejectattr('action', 'eq', 'TAPO_H500_SNOOZE')
                   | list + save }}

  # First: immediately, without a picture. There is not one yet.
  - action: "{{ service }}"
    data:
      title: "{{ headline }}"
      message: >-
        {% if who %}{{ who }} — {% endif %}{% if seen %}{{ seen }}, {% endif %}{{ when }}
      data:
        tag: "tapo-h500-{{ camera }}"
        # An unfamiliar face at night gets a high-importance channel, which is
        # what makes a phone sound different -- the entire point of telling it
        # apart from a daytime delivery.
        channel: "{{ 'Tapo H500 alerts' if notable else 'Tapo H500' }}"
        importance: "{{ 'high' if notable else 'default' }}"
        clickAction: "{{ link }}"
        url: "{{ link }}"
        actions: "{{ buttons }}"

  # Then, if asked: wait for this event's own clip and replace the alert with
  # one carrying its frame. Same tag, so it takes the first one's place.
  - if:
      - condition: template
        value_template: "{{ input_send_photo }}"
    then:
      - wait_template: >-
          {{ as_timestamp(states(activity), 0) | int >= moment }}
        timeout: "00:03:00"
        continue_on_timeout: false
      # Indexed is not downloaded, and the thumbnail is written by the
      # download. The wait above did the real work; this covers the gap.
      - delay: "00:00:08"
      - condition: template
        value_template: "{{ frame not in [none, '', 'None'] }}"
      - action: "{{ service }}"
        data:
          title: "{{ headline }}"
          message: >-
            {% if who %}{{ who }} — {% endif %}{% if seen %}{{ seen }}, {% endif %}{{ when }}
          data:
            image: "{{ frame }}"
            tag: "tapo-h500-{{ camera }}"
            # Same channel as the first, or replacing it would quietly demote
            # a night alert to an ordinary one.
            channel: "{{ 'Tapo H500 alerts' if notable else 'Tapo H500' }}"
            importance: "{{ 'high' if notable else 'default' }}"
            clickAction: "{{ link }}"
            url: "{{ link }}"
            actions: "{{ photo_buttons }}"

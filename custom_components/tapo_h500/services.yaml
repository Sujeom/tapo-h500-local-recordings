list_recordings:
  name: List recordings
  description: List recordings stored locally on the H500, marking which are already downloaded.
  fields:
    config_entry_id:
      name: Config entry ID
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    camera_index:
      name: Camera index
      default: 0
      selector:
        number:
          min: 0
          max: 15
          mode: box
    start_date:
      name: Start date
      description: YYYYMMDD; defaults to today in UTC.
      selector:
        text:
    end_date:
      name: End date
      description: YYYYMMDD; defaults to today in UTC.
      selector:
        text:

download_recording:
  name: Download recording
  description: Download one indexed recording from the H500 into Home Assistant local media.
  fields:
    config_entry_id:
      name: Config entry ID
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    camera_index:
      name: Camera index
      default: 0
      selector:
        number:
          min: 0
          max: 15
          mode: box
    start_time:
      name: Start time
      description: Exact Unix start time returned by List recordings.
      required: true
      selector:
        number:
          min: 0
          mode: box
    end_time:
      name: End time
      description: Exact Unix end time returned by List recordings.
      required: true
      selector:
        number:
          min: 0
          mode: box
    convert_to_mp4:
      name: Convert to MP4
      description: Overrides the integration option for this download.
      selector:
        boolean:

delete_recording:
  name: Delete downloaded recording
  description: Remove the downloaded copy and its thumbnail. The hub keeps its own copy.
  fields:
    config_entry_id:
      name: Config entry ID
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    camera_index:
      name: Camera index
      default: 0
      selector:
        number:
          min: 0
          max: 15
          mode: box
    start_time:
      name: Start time
      description: Exact Unix start time of the recording to remove.
      required: true
      selector:
        number:
          min: 0
          mode: box

format_hub_storage:
  name: Erase all hub recordings
  description: >-
    Formats the H500's storage. The hub exposes no per-clip delete, so this
    erases every recording for every paired camera. There is no undo.
  fields:
    config_entry_id:
      name: Config entry ID
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    confirm:
      name: Confirm
      description: Must be enabled. Every recording on the hub will be destroyed.
      required: true
      selector:
        boolean:

name_face:
  name: Name a face
  description: >-
    Give one of the hub's face ids a name, or clear it by leaving the name
    empty. The hub clusters faces and hands out stable ids but will not say who
    anyone is, so the name has to come from you. It is stored once on the hub's
    config entry and used by every card and by the per-face sensors.
  fields:
    config_entry_id:
      name: Hub
      description: The H500 config entry.
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    face_id:
      name: Face ID
      description: >-
        The number the hub uses for this person. Cards show it as "Face
        123456789012" for anyone unnamed, and it is in an event's face_ids.
      required: true
      example: "123456789012"
      selector:
        text:
    name:
      name: Name
      description: What to call them. Leave empty to remove the name.
      example: Alice
      selector:
        text:

describe_recording:
  name: Describe a recording
  description: >-
    Ask a vision model what is in a recording's own frame. Nothing is sent
    anywhere unless this is called with an explicit agent, so an installation
    with no AI configured is unaffected.
  fields:
    config_entry_id:
      name: Hub
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    camera_index:
      name: Camera
      default: 0
      selector:
        number: {min: 0, max: 15, mode: box}
    start_time:
      name: Recording start
      description: The clip's start time, as listed by list_recordings.
      required: true
      selector:
        number: {min: 0, mode: box}
    agent_id:
      name: AI agent
      description: >-
        The conversation agent or AI task entity to ask. Required rather than
        guessed, because picking one silently could send a picture of your
        doorstep to a cloud service.
      required: true
      example: ai_task.google_ai_task
      selector:
        text:
    prompt:
      name: Prompt
      description: >-
        Overrides the default, which deliberately asks only for what is
        visible and forbids speculation about intent.
      selector:
        text:
          multiline: true

daily_summary:
  name: Daily summary
  description: >-
    One sentence per camera for the period. A service rather than a schedule:
    nothing is sent until an automation calls it, so no digest arrives unasked.
  fields:
    config_entry_id:
      name: Hub
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    hours:
      name: Hours
      description: How far back to summarise. Limited by what the hub still holds.
      default: 24
      selector:
        number: {min: 1, max: 168, unit_of_measurement: hours, mode: box}

find_face:
  name: Find a person's recordings
  description: >-
    Every recording someone appears in, newest first. face_ids has been on
    every clip since the beginning and nothing could search it — the media
    browser groups by camera and date only.
  fields:
    config_entry_id:
      name: Hub
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    who:
      name: Who
      description: >-
        A name you have given someone, or the hub's own face id. A name may
        resolve to more than one id: the hub clusters the same person again
        when lighting differs, and both may have been named.
      required: true
      example: Alice
      selector:
        text:

export_recording:
  name: Export a recording
  description: >-
    Copy a downloaded clip and its thumbnail somewhere retention cannot reach.
    Copies rather than moves, so the media directory stays the working set and
    existing cards keep working. The destination must be listed in
    allowlist_external_dirs.
  fields:
    config_entry_id:
      name: Hub
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    camera_index:
      name: Camera
      default: 0
      selector:
        number: {min: 0, max: 15, mode: box}
    start_time:
      name: Recording start
      required: true
      selector:
        number: {min: 0, mode: box}
    destination:
      name: Destination directory
      description: >-
        An allowed directory. Clips land under <destination>/<camera>/<date>/.
      required: true
      example: /media/nas/doorbell
      selector:
        text:

snooze:
  name: Snooze notifications
  description: >-
    Mute notifications for a while without disabling the automation, which is
    the thing people forget to turn back on. Nothing stops recording,
    downloading or firing events -- footage during a snooze is the footage most
    likely to be wanted afterwards. Only an automation that was told to check
    switch.<hub>_notifications_snoozed is affected. A snooze does not survive a
    Home Assistant restart.
  fields:
    config_entry_id:
      name: Hub
      required: true
      selector:
        config_entry:
          integration: tapo_h500
    minutes:
      name: Minutes
      description: >-
        Leave empty to snooze until it is turned off by hand. 0 cancels a
        snooze already running.
      example: 60
      selector:
        number: {min: 0, max: 1440, mode: box, unit_of_measurement: min}
